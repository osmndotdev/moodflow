<!-- MoodFlow app logo (OAuth consent screens): the favicon's equalizer tile, full-bleed square with
     the bars kept inside the central circle so a round crop doesn't clip them. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5fa2"/>
      <stop offset="1" stop-color="#a46bff"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" fill="url(#g)"/>
  <g fill="#fff">
    <rect x="26.5" y="58" width="13" height="32" rx="6.5"/>
    <rect x="44.5" y="30" width="13" height="60" rx="6.5"/>
    <rect x="62.5" y="46" width="13" height="44" rx="6.5"/>
    <rect x="80.5" y="66" width="13" height="24" rx="6.5"/>
  </g>
</svg>
